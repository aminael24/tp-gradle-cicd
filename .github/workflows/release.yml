name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: self-hosted

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build without cache
        run: |
          docker build --no-cache \
          -t ghcr.io/aminael24/tp-gradle-cicd:${{ github.ref_name }} .

      - name: Push image
        run: |
          docker push \
          ghcr.io/aminael24/tp-gradle-cicd:${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
          --title "${{ github.ref_name }}" \
          --generate-notes
