image: eclipse-temurin:11-jdk

stages:
  - build
  - test
  - docker

before_script:
  - chmod +x gradlew

compile:
  stage: build
  script:
    - ./gradlew --no-daemon assemble

tests:
  stage: test
  script:
    - ./gradlew --no-daemon test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

docker_build:
  stage: docker
  image: docker:29.1.4

  services:
    - docker:29.1.4-dind

  script:
    - docker build --provenance=false -t "$CI_REGISTRY_IMAGE:latest" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:latest"

  only:
    - develop
docker_release:
  stage: docker
  image: docker:29.1.4

  services:
    - docker:29.1.4-dind

  script:
    - |
      if ! echo "$CI_COMMIT_TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag invalide : $CI_COMMIT_TAG"
        exit 1
      fi
    - docker build --no-cache --provenance=false -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

  rules:
    - if: '$CI_COMMIT_TAG'
