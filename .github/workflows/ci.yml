name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Check Java version
        run: java -version

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble

      - name: Tests
        run: ./gradlew test

  docker-develop:
    if: github.ref == 'refs/heads/develop'
    needs: build-test
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
          -u "${{ github.actor }}" \
          --password-stdin

      - name: Build Docker image
        run: |
          docker build \
          -t ghcr.io/aminael24/tp-gradle-cicd:latest .

      - name: Push Docker image
        run: |
          docker push ghcr.io/aminael24/tp-gradle-cicd:latest
