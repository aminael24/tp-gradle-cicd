name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble

      - name: Tests
        run: ./gradlew test
